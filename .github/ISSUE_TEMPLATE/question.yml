name: Question
description: Ask a question about Projects
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about Projects? We're here to help!
  
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know about Projects?
      placeholder: How do I...? / What is...? / Can Projects...?
    validations:
      required: true
  
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any additional context that might help us answer your question better.
      placeholder: |
        I'm trying to...
        I've already tried...
  
  - type: input
    id: version
    attributes:
      label: Projects Version
      description: What version of Projects are you using (if relevant)?
      placeholder: e.g., 1.2.3
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information that might be helpful.
  
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues and documentation for an answer to my question
          required: true
